<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<title>Expo Village Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F7FA; --surface:#FFFFFF; --soft:#F0F0F5; --ink:#151515; --muted:#5F5F6B; --line:#E4E4EC;
  --yellow:#E7E629; --pink:#EE4D9B; --teal:#97D5CC; --lilac:#7781B8;
  --g-pinkyellow:linear-gradient(90deg,#EE4D9B 0%,#E7E629 100%);
  --g-pinklilac:linear-gradient(90deg,#EE4D9B 0%,#7781B8 100%);
  --g-lilacteal:linear-gradient(90deg,#7781B8 0%,#97D5CC 100%);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:Montserrat,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:15px;line-height:1.45;
  -webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--lilac);outline-offset:2px}
img{max-width:100%}
.muted{color:var(--muted)}
.small{font-size:13px}
.wrap{max-width:1200px;margin:0 auto;padding:18px 16px 40px}
.narrow{max-width:540px;margin:0 auto;padding:16px 16px 40px}
h1,h2,h3{margin:0;line-height:1.15}
h3{font-size:15px;font-weight:700}

/* Expo headline treatment: uppercase, heavy, gradient ink, yellow rule */
.hl{font-weight:900;text-transform:uppercase;letter-spacing:-.01em;background:var(--g-pinklilac);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
h1.hl{font-size:30px}
.sechead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--yellow);padding-bottom:8px;margin:8px 0 14px}
.sechead h2{font-size:22px}
.sechead .count{font-weight:800;font-size:22px;color:var(--ink)}
.sechead .spacer{flex:1}

/* Buttons: pill shapes echo the Expo graphic */
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:700}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.pink{background:var(--pink);border-color:var(--pink);color:var(--ink)}
.btn.danger{border-color:var(--pink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.big{display:flex;align-items:center;gap:14px;width:100%;border:0;border-radius:999px;padding:20px 26px;
  font-size:20px;font-weight:800;text-align:left;color:var(--ink)}
.big .ic{font-size:28px;line-height:1}
.big.clean{background:var(--teal)}
.big.report{background:var(--surface);border:2.5px solid var(--pink)}
.big.send{background:var(--ink);color:#fff}
.big.home{background:var(--yellow);justify-content:center}
.big[disabled]{opacity:.45}

/* Header */
.bar{background:var(--surface);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.bar::after{content:"";display:block;height:4px;background:var(--g-pinkyellow)}
.bar .in{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{height:40px;width:auto;display:block}
.apptitle{display:grid;line-height:1.15}
.apptitle strong{font-size:15px;font-weight:800}
.apptitle span{font-size:12px;color:var(--muted);font-weight:600}
.demo{font-size:11px;font-weight:800;background:var(--yellow);color:var(--ink);padding:3px 9px;border-radius:999px}
.bar .spacer{flex:1}
.bar .who{font-size:13px;font-weight:600;color:var(--muted)}
.bar .btn{padding:7px 13px;font-size:13px}

@media (max-width:520px){.bar .apptitle{display:none}.bar .in{gap:8px;padding:8px 12px;flex-wrap:nowrap}.bar .btn{padding:6px 11px}.logo{height:34px}}
.nw{white-space:nowrap}
/* Chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;color:var(--ink)}
.st-dirty{background:var(--yellow)} .st-clean{background:var(--teal)} .st-inspected{background:var(--lilac)} .st-ooo{background:var(--pink)}
.p1{background:var(--pink)} .p2{background:var(--yellow)} .p3{background:var(--soft)}
.ts-open{background:transparent;border:1.5px solid var(--ink)}
.ts-prog{background:var(--lilac)} .ts-hold{background:var(--yellow)} .ts-closed{background:var(--soft);color:var(--muted)}

/* Login */
.login .logo{height:64px;margin:18px 0 22px}
.userpick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0}
.userpick button{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:16px;text-align:left}
.userpick button strong{display:block;font-size:17px}
.userpick button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.pindots{display:flex;gap:14px;justify-content:center;margin:18px 0}
.pindots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink)}
.pindots i.on{background:var(--pink);border-color:var(--pink)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keypad button{background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:14px 0;font-size:24px;font-weight:700}
.keypad button:active{background:var(--soft)}
.err{color:#C2185B;font-weight:700;text-align:center;min-height:22px}
.lang{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;padding:5px 11px;font-weight:800;font-size:13px}
.lang button[aria-pressed="true"]{background:var(--yellow)}

/* Cleaner */
.stack{display:grid;gap:12px}
.roomhead{font-size:40px;font-weight:900;letter-spacing:-.02em;margin:6px 0 4px}
.backlink{background:none;border:0;padding:6px 0;font-weight:800;font-size:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field{display:grid;gap:6px}
.field label{font-weight:700;font-size:13px}
.input,select.input,textarea.input{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
textarea.input{min-height:80px;resize:vertical}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px;font-weight:700;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.seg.fill button{flex:1;padding:11px 6px}
.floor{margin-top:14px}
.floor h3{margin-bottom:8px;color:var(--muted);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.rtile{position:relative;border:0;border-radius:16px;padding:12px 4px 10px;font-weight:800;font-size:18px;color:var(--ink);text-align:center}
.rtile small{display:block;font-size:11px;font-weight:700}
.rtile .b{position:absolute;top:-6px;right:-6px;background:var(--ink);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;border:2px solid var(--surface)}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px 14px;text-align:left;font-weight:700;font-size:16px;display:flex;flex-direction:column;gap:6px}
.cat .ic{font-size:30px}
.cat[aria-pressed="true"]{border-color:var(--pink);background:#FDEAF3}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px;font-weight:700;font-size:16px}
.toggle input{width:28px;height:28px;accent-color:var(--pink);flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.sent{text-align:center;padding:40px 10px}
.sent .tick{width:96px;height:96px;border-radius:50%;background:var(--teal);display:grid;place-items:center;font-size:54px;margin:0 auto 18px;animation:pop .35s ease-out both}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){.sent .tick{animation:none}}
.issue{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.issue:first-child{border-top:0}
.issue .ic{font-size:24px}
.issue .grow{flex:1;display:grid}
.issue .sub{font-size:13px;color:var(--muted)}

/* Desk */
.counters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.counter{border:0;border-radius:18px;padding:12px 16px;text-align:left;color:var(--ink)}
.counter strong{display:block;font-size:28px;font-weight:900;line-height:1}
.counter span{font-weight:700;font-size:13px}
.counter[aria-pressed="false"]{opacity:.3}
@media (max-width:560px){.counters{grid-template-columns:repeat(2,1fr)}}
.bld{margin-bottom:12px}
.bld h3.bt{font-size:16px;font-weight:800}
.bld .floor{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:start;margin-top:10px}
.bld .floor h3{margin:12px 0 0;font-size:13px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .input{width:auto;min-width:180px;flex:1}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchips button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-weight:700;font-size:13px}
.fchips button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tlist{display:grid;gap:8px}
.trow{display:grid;grid-template-columns:6px auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px 12px 0;text-align:left;width:100%;overflow:hidden}
.trow .edge{align-self:stretch;margin:-12px 0;background:var(--soft)}
.trow .edge.p1{background:var(--pink)} .trow .edge.p2{background:var(--yellow)}
.trow .ic{font-size:24px}
.trow .t1{font-weight:700}
.trow .t2{font-size:13px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:62ch}
.trow .right{display:grid;justify-items:end;gap:5px}
.age{font-size:12px;font-weight:700;color:var(--muted)}
.age.old{color:#C2185B}
.empty{padding:26px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:16px}
.gap{height:26px}

/* Modal */
.scrim{position:fixed;inset:0;background:rgba(21,21,21,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet::before{content:"";display:block;height:4px;border-radius:4px;background:var(--g-pinkyellow);margin:-6px 0 14px}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:24px}}
.sheet .hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sheet .hd h2{flex:1;font-size:20px;font-weight:900}
.x{border:0;background:var(--soft);border-radius:50%;width:34px;height:34px;font-size:18px;flex:none}
.meta{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:14px;margin:10px 0}
.meta dt{color:var(--muted);font-weight:600}
.meta dd{margin:0}
.hist{font-size:13px;border-left:3px solid var(--yellow);padding-left:12px;display:grid;gap:6px}
.hist b{font-weight:700}
.section{margin-top:16px}
.section > h3{margin-bottom:8px}
.photo{border-radius:14px;max-height:260px;object-fit:cover}

/* Toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;
  padding:12px 12px 12px 18px;border-radius:999px;display:flex;gap:14px;align-items:center;z-index:60;font-weight:600;width:max-content;max-width:calc(100% - 32px)}
.toast button{background:var(--yellow);color:var(--ink);border:0;border-radius:999px;padding:7px 14px;font-weight:800}
/* Live build additions */
.live{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--ink);white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.live.on i{background:#1E9E6A}
.live.down{background:var(--yellow)} .live.down i{background:#C2185B}
.stale{display:none;background:var(--yellow);border-radius:14px;padding:10px 14px;font-weight:700;margin-bottom:10px;width:100%;border:0;text-align:left}
.stale.show{display:block}
.busy button,.busy .keypad button{pointer-events:none}
.busy{cursor:progress}
.idform{display:grid;gap:10px;margin:22px 0}
.idform .input{font-size:22px;font-weight:800;text-align:center;letter-spacing:.04em;border-radius:999px;padding:14px 18px;text-transform:uppercase}
.center{text-align:center}
.loading{padding:60px 10px;text-align:center;font-weight:700;color:var(--muted)}
.note{font-size:12px;color:var(--muted)}
.counters.c3{grid-template-columns:repeat(3,1fr)}
</style>
</head>

/* ============ Small helpers ============ */
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return String(n).padStart(2,'0')}
function $(sel,root){return (root||document).querySelector(sel)}
function $all(sel,root){return Array.prototype.slice.call((root||document).querySelectorAll(sel))}
function natCmp(a,b){return String(a).localeCompare(String(b),undefined,{numeric:true,sensitivity:'base'})}
function uid(){try{return crypto.randomUUID()}catch(e){return Date.now().toString(36)+Math.random().toString(36).slice(2,10)}}

var skew=0; /* server clock minus device clock, ms */
function now(){return Date.now()+skew}
function ms(v){return v?Date.parse(v):null}
var TZ='Europe/Belgrade';
var fmtHM=new Intl.DateTimeFormat('en-GB',{timeZone:TZ,hour:'2-digit',minute:'2-digit',hour12:false});
var fmtDM=new Intl.DateTimeFormat('en-GB',{timeZone:TZ,day:'2-digit',month:'2-digit'});
var fmtCSV=new Intl.DateTimeFormat('sv-SE',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
function fmtTime(t){return t?fmtHM.format(new Date(t)):''}
function fmtDT(t){return t?fmtDM.format(new Date(t))+' '+fmtHM.format(new Date(t)):''}
function csvTime(v){return v?fmtCSV.format(new Date(v)):''}
function dur(m0){var m=Math.max(0,Math.round(m0/60000));if(m<60)return m+' min';var h=Math.floor(m/60);if(h<24)return h+' h '+(m%60)+' min';return Math.floor(h/24)+' d '+(h%24)+' h'}

function catLabel(c){return (lang==='sr'&&c.label_sr)?c.label_sr:c.label_en}

function langToggle(){return '<span class="lang" role="group" aria-label="Language"><button data-l="en" aria-pressed="'+(lang==='en')+'">EN</button><button data-l="sr" aria-pressed="'+(lang==='sr')+'">SR</button></span>'}

/* ============ Data ============ */
var ME=null;
var D={rooms:{},order:[],buildings:[],floors:{},req:{},cats:[],catMap:{},depts:[],pri:{},priLevels:[]};

function cat(id){return D.catMap[id]||{id:id,icon:'💬',label_en:id,label_sr:'',default_department:'',default_priority:3}}
function priLabel(p){return (D.pri[p]&&D.pri[p].label)||('P'+p)}
function priClass(p){return 'p'+Math.min(Math.max(p,1),3)}
function isActive(t){return t.status!=='Closed'}
function allReq(){return Object.keys(D.req).map(function(k){return D.req[k]})}
function activeReq(){return allReq().filter(isActive)}
function openReq(room){return allReq().filter(function(t){return t.room_id===room&&isActive(t)})}
function byPriority(a,b){if(a.priority!==b.priority)return a.priority-b.priority;return ms(a.created_at)-ms(b.created_at)}
function isSup(){return ME&&ME.role==='supervisor'}
function isCleaner(){return ME&&ME.role==='cleaner'}

/* Running clock: excludes time On Hold and time Closed before a reopen. */
function runMs(t){
  var paused=(t.paused_seconds||0)*1000+(t.clock_paused_at?Math.max(0,now()-ms(t.clock_paused_at)):0);
  return Math.max(0,now()-ms(t.created_at)-paused);
}
function isLate(t){
  if(!isActive(t)||t.status==='On Hold')return false;
  var p=D.pri[t.priority]; return !!p&&runMs(t)>p.alert_minutes*60000;
}

function reindexRooms(){
  var ids=Object.keys(D.rooms);
  ids.sort(function(a,b){var ra=D.rooms[a],rb=D.rooms[b];
    return (ra.sort-rb.sort)||natCmp(ra.building,rb.building)||natCmp(ra.floor,rb.floor)||natCmp(ra.label,rb.label)});
  D.order=ids; D.buildings=[]; D.floors={};
  ids.forEach(function(id){var r=D.rooms[id];
    if(D.buildings.indexOf(r.building)<0){D.buildings.push(r.building);D.floors[r.building]=[]}
    if(D.floors[r.building].indexOf(r.floor)<0)D.floors[r.building].push(r.floor)});
  D.buildings.sort(natCmp); D.buildings.forEach(function(b){D.floors[b].sort(natCmp)});
  if(D.buildings.length&&D.buildings.indexOf(V.clBld)<0)V.clBld=D.buildings[0];
}
function applyRoom(r){
  if(!r||!r.id)return;
  var had=!!D.rooms[r.id];
  if(r.active===false){if(had){delete D.rooms[r.id];reindexRooms()}return}
  D.rooms[r.id]=r; if(!had)reindexRooms();
}
function applyReq(t){
  if(!t||!t.id)return;
  if(isCleaner()&&!isActive(t)){delete D.req[t.id];return}
  D.req[t.id]=t;
}

async function fetchAll(table,build){
  var out=[],from=0,size=1000;
  for(;;){
    var q=sb.from(table).select('*'); if(build)q=build(q);
    var r=await q.range(from,from+size-1);
    if(r.error)throw r.error;
    out=out.concat(r.data||[]);
    if(!r.data||r.data.length<size)break;
    from+=size;
  }
  return out;
}
async function syncClock(){
  var t0=Date.now(), r=await sb.rpc('server_time'), t1=Date.now();
  if(!r.error&&r.data)skew=Date.parse(r.data)-Math.round((t0+t1)/2);
}
async function loadAll(){
  await syncClock();

  var res=await Promise.all([
    fetchAll('categories',function(q){return q.eq('active',true).order('sort').order('id')}),
    fetchAll('departments',function(q){return q.eq('active',true).order('sort').order('id')}),
    fetchAll('priorities',function(q){return q.order('level')}),
    fetchAll('rooms',function(q){return q.eq('active',true).order('id')}),
    fetchAll('requests',function(q){
      return (isCleaner()?q.neq('status','Closed'):q.or('status.neq.Closed,closed_at.gte."'+since+'"')).order('id')})
  ]);
  D.cats=res[0]; D.catMap={}; D.cats.forEach(function(c){D.catMap[c.id]=c});
  D.depts=res[1].map(function(d){return d.id});
  D.pri={}; D.priLevels=[]; res[2].forEach(function(p){D.pri[p.level]=p;D.priLevels.push(p.level)});
  D.rooms={}; res[3].forEach(function(r){D.rooms[r.id]=r}); reindexRooms();
  D.req={}; res[4].forEach(function(t){D.req[t.id]=t});
}

/* ============ Realtime ============ */
var chan=null, liveState='down', needResync=true, liveTimer=null;
function subscribe(){
  if(chan)sb.removeChannel(chan);
  chan=sb.channel('exv-live')
    .on('postgres_changes',{event:'*',schema:'public',table:'rooms'},function(p){
      var r=p.new; if(!r||!r.id)return;
      var prev=D.rooms[r.id], changed=!prev||prev.status!==r.status||prev.status_at!==r.status_at||r.active===false;
      applyRoom(r); if(changed){scheduleLive(); if(MODAL.kind==='room'&&MODAL.id===r.id)markStale()}
    })
    .on('postgres_changes',{event:'*',schema:'public',table:'requests'},function(p){
      var t=p.new; if(!t||!t.id)return;
      var prev=D.req[t.id], changed=!prev||prev.updated_at!==t.updated_at;
      applyReq(t); if(changed){scheduleLive(); if(MODAL.kind==='ticket'&&MODAL.id===t.id)markStale()}
    })
    .subscribe(function(status){
      if(status==='SUBSCRIBED'){setLive('on'); if(needResync){needResync=false; resync()}}
      else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED'){needResync=true; setLive('down')}
    });
}
function teardown(){if(chan){sb.removeChannel(chan);chan=null}needResync=true;setLive('down')}
async function resync(){
  try{await loadAll(); liveRender()}catch(e){/* keep what we have; next reconnect retries */}
}
function setLive(s){liveState=s;var el=$('#live');if(el)el.outerHTML=livePill()}
function livePill(){var on=liveState==='on';return '<span id="live" class="live '+(on?'on':'down')+'"><i></i>'+(on?T('live'):T('reconnecting'))+'</span>'}
function scheduleLive(){clearTimeout(liveTimer);liveTimer=setTimeout(liveRender,250)}
function typing(){var a=document.activeElement;return a&&app.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)}
/* Update screens without wiping what someone is typing. */
function liveRender(){
  if(!ME)return;
  if(isCleaner()){
    if(V.cl==='report'||V.cl==='sent'||typing())return;
    rerenderKeep(); return;
  }
  var rl=$('#reqlist'), rb=$('#roomboard');
  if(!rl||!rb){rerenderKeep();return}
  var ac=$('#actcount'); if(ac)ac.textContent=activeReq().length;
  var ct=$('#counters'); if(ct){ct.innerHTML=countersHtml();bindCounters()}
  rl.innerHTML=reqList(); bindReqList();
  rb.innerHTML=roomBoard(); bindRoomBoard();
}
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'&&ME){syncClock().catch(function(){}); resync()}
});

function errText(e){
  var m=(e&&(e.message||e.error_description))||String(e||'');
  if(/Failed to fetch|NetworkError|Load failed|network/i.test(m))return T('offline');
  return m.replace(/^.*?ERROR:\s*/,'');
}

}

/* Finds a room from what was typed: full ID, 4-digit shorthand, or number within the building on screen. */
function findRoom(v,bld){
  v=normRoom(v); if(!v)return null;
  var byId={}; D.order.forEach(function(id){byId[id.toUpperCase()]=id});
  if(byId[v])return byId[v];
  if(/^\d{4}$/.test(v)&&byId[v[0]+'-'+v.slice(1)])return byId[v[0]+'-'+v.slice(1)];
  var inB=D.order.filter(function(id){var r=D.rooms[id];return r.building===bld&&String(r.label).toUpperCase()===v});
  if(inB.length===1)return inB[0];
  var any=D.order.filter(function(id){return String(D.rooms[id].label).toUpperCase()===v});
  return any.length===1?any[0]:null;
}

    var t=await act('create_request',{p_room:V.clRoom,p_category:V.rep.cat,p_description:V.rep.note,p_unusable:!!V.rep.unusable,p_photo_path:path});
    if(!t){s.disabled=false;$('#sndt').textContent=T('send');return}
    applyReq(t); if(t.room_unusable)await refreshRoom(t.room_id);

function compress(file,cb){
  var rd=new FileReader();
  rd.onload=function(){var img=new Image();img.onload=function(){
    var max=1200,w=img.width,h=img.height,sc=Math.min(1,max/Math.max(w,h));
    var c=document.createElement('canvas');c.width=Math.round(w*sc);c.height=Math.round(h*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    c.toBlob(function(blob){cb(c.toDataURL('image/jpeg',0.6),blob)},'image/jpeg',0.6);
  };img.src=rd.result};
  rd.readAsDataURL(file);
}

function filteredTickets(){
  var list=allReq().filter(function(t){
    if(V.tFilter==='Active'&&!isActive(t))return false;
    if(V.tFilter!=='Active'&&V.tFilter!=='All'&&t.status!==V.tFilter)return false;
    if(V.tDept!=='All'&&t.department!==V.tDept)return false;
    if(V.tq){var s=(t.id+' '+t.room_id+' '+cat(t.category_id).label_en+' '+t.description).toLowerCase();if(s.indexOf(V.tq.toLowerCase())<0)return false}
    return true;
  });
  list.sort(function(a,b){
    var ac=!isActive(a),bc=!isActive(b);
    if(ac!==bc)return ac?1:-1;
    if(ac)return ms(b.closed_at)-ms(a.closed_at);
    return byPriority(a,b);
  });
  return list;
}

    '<button class="btn" data-x="rooms">Room status now ('+D.order.length+')</button>'+
    '<button class="btn" data-x="log">Room status changes</button></div><p class="muted small" id="xmsg"></p>';
  openLayer(h,'export',null);
  $all('[data-x]',layer).forEach(function(b){b.onclick=function(){exportCSV(b.dataset.x)}});
}

/* ---------- Export ---------- */
function csv(rows){return rows.map(function(r){return r.map(function(v){v=v==null?'':String(v);
  if(/^[=+\-@]/.test(v))v="'"+v; /* stop Excel treating text as a formula */
  return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')}).join('\r\n')}
async function exportCSV(kind){
  var msg=$('#xmsg'), stamp=new Date().toISOString().slice(0,10), rows, name;
  if(msg)msg.textContent='Preparing…';
  try{
    if(kind==='tickets'){
      var all=await fetchAll('requests',function(q){return q.order('id')});
      var ev=await fetchAll('request_events',function(q){return q.order('id')});
      var hist={}; ev.forEach(function(e){(hist[e.request_id]=hist[e.request_id]||[]).push(csvTime(e.at)+' '+e.by_staff+': '+e.action)});
      rows=[['Request ID','Room','Building','Category','Source','Description','Priority','Department','Status','Room unusable','Created at','Created by','Closed at','Closure reason','Duplicate of','Clock minutes (excl. On Hold)','Has photo','History']];
      all.forEach(function(t){var r=D.rooms[t.room_id];rows.push([t.id,t.room_id,r?r.building:'',cat(t.category_id).label_en,t.source,t.description,'P'+t.priority,t.department,t.status,t.room_unusable?'Yes':'No',
        csvTime(t.created_at),t.created_by,csvTime(t.closed_at),t.closure_reason==='Duplicate'?'Duplicate of [ID]':(t.closure_reason||''),t.duplicate_of||'',Math.round(runMs(t)/60000),t.photo_path?'Yes':'No',(hist[t.id]||[]).join(' | ')])});
      name='expo_village_requests_'+stamp+'.csv';
    } else if(kind==='rooms'){
      var rs=await fetchAll('rooms',function(q){return q.eq('active',true).order('id')});
      rows=[['Room','Building','Floor','Status','Last changed','Changed by','Open requests']];
      rs.forEach(function(r){rows.push([r.id,r.building,r.floor,ROOM_ST[r.status].en,csvTime(r.status_at),r.status_by||'',openReq(r.id).length])});
      name='expo_village_room_status_'+stamp+'.csv';
    } else {
      var lg=await fetchAll('room_log',function(q){return q.order('id')});
      rows=[['Time','Room','From','To','By','Note','Request']];
      lg.forEach(function(l){rows.push([csvTime(l.at),l.room_id,(ROOM_ST[l.from_status]||{en:l.from_status}).en,(ROOM_ST[l.to_status]||{en:l.to_status}).en,l.by_staff,l.note,l.request_id||''])});
      name='expo_village_room_changes_'+stamp+'.csv';
    }
  }catch(e){if(msg)msg.textContent=errText(e);return}
  var blob=new Blob(['\uFEFF'+csv(rows)],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href)},5000);
  if(msg)msg.textContent='Downloaded '+name+' ('+(rows.length-1)+' rows)';
}

/* ---------- Toast ---------- */
var toastTimer=null;
function showToast(text,actionLabel,action){
  var old=document.getElementById('toast'); if(old)old.remove();
  var d=document.createElement('div');d.className='toast';d.id='toast';d.setAttribute('role','status');
  d.innerHTML='<span>'+esc(text)+'</span>'+(actionLabel?'<button>'+esc(actionLabel)+'</button>':'');
  document.body.appendChild(d);
  if(actionLabel)d.querySelector('button').onclick=function(){d.remove();action()};
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){d.remove()},actionLabel?7000:4500);
}

/* ---------- Boot ---------- */
sb.auth.onAuthStateChange(function(ev){
  if(ev==='SIGNED_OUT'&&ME){ME=null;teardown();closeLayer();login.step=login.id?'pin':'id';renderLogin()}
});
(async function boot(){
  renderLoading();
  var s=null; try{s=(await sb.auth.getSession()).data.session}catch(e){}
  if(s)await afterSignIn(); else renderLogin();
})();
/* Age labels and late flags tick once a minute on the desk. */
setInterval(function(){if(ME&&!isCleaner()&&!layer.innerHTML&&!typing())liveRender()},60000);
/* Safety net: full resync every 10 minutes in case a realtime message was missed. */
setInterval(function(){if(ME&&document.visibilityState==='visible')resync()},600000);
})();
</script>
